<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" fill="none">
  <!-- Whiskey / spirits bottle (left) -->
  <g opacity="0.18" stroke="#34d399" stroke-linecap="round" stroke-linejoin="round">
    <!-- bottle body -->
    <rect x="60" y="180" width="52" height="200" rx="10" stroke-width="2.5"/>
    <!-- bottle neck -->
    <rect x="75" y="130" width="22" height="55" rx="5" stroke-width="2"/>
    <!-- bottle cap -->
    <rect x="73" y="118" width="26" height="16" rx="4" fill="#34d399" opacity="0.25" stroke-width="2"/>
    <!-- label outline -->
    <rect x="68" y="210" width="36" height="50" rx="4" stroke-width="1.5" stroke-dasharray="3 2"/>
    <!-- horizontal lines on label -->
    <line x1="72" y1="225" x2="100" y2="225" stroke-width="1"/>
    <line x1="72" y1="235" x2="100" y2="235" stroke-width="1"/>
    <line x1="72" y1="245" x2="90" y2="245" stroke-width="1"/>
  </g>

  <!-- Wine bottle (right side) -->
  <g opacity="0.14" stroke="#6ee7b7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="800" y="160" width="56" height="220" rx="12" stroke-width="2.5"/>
    <!-- narrow neck -->
    <rect x="817" y="95" width="22" height="70" rx="5" stroke-width="2"/>
    <!-- foil top -->
    <rect x="815" y="82" width="26" height="18" rx="3" fill="#6ee7b7" opacity="0.2" stroke-width="2"/>
    <!-- label -->
    <rect x="807" y="205" width="42" height="60" rx="4" stroke-width="1.5"/>
    <line x1="812" y1="222" x2="844" y2="222" stroke-width="1"/>
    <line x1="812" y1="232" x2="844" y2="232" stroke-width="1"/>
    <line x1="812" y1="242" x2="836" y2="242" stroke-width="1"/>
  </g>

  <!-- Cocktail glass (martini) center-right -->
  <g opacity="0.15" stroke="#2dd4bf" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2">
    <!-- glass bowl (trapezoid as polyline) -->
    <polyline points="620,140 680,140 660,220 640,220 620,140"/>
    <!-- stem -->
    <line x1="650" y1="220" x2="650" y2="280"/>
    <!-- base -->
    <line x1="620" y1="280" x2="680" y2="280"/>
    <!-- olive on pick -->
    <line x1="625" y1="145" x2="665" y2="160"/>
    <circle cx="665" cy="162" r="5" stroke-width="2"/>
  </g>

  <!-- Rocks / lowball glass (bottom left area) -->
  <g opacity="0.13" stroke="#34d399" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <!-- glass body -->
    <path d="M200,310 L210,420 L270,420 L280,310 Z"/>
    <!-- ice cube 1 -->
    <rect x="218" y="355" width="22" height="22" rx="3" stroke-width="1.5" stroke-dasharray="2 2"/>
    <!-- ice cube 2 -->
    <rect x="245" y="365" width="18" height="18" rx="3" stroke-width="1.5" stroke-dasharray="2 2"/>
    <!-- liquid line -->
    <line x1="207" y1="390" x2="273" y2="390" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- Beer mug (center-left) -->
  <g opacity="0.12" stroke="#a7f3d0" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <!-- mug body -->
    <path d="M380,200 Q376,230 376,340 L456,340 Q456,230 452,200 Z"/>
    <!-- handle -->
    <path d="M456,245 Q490,245 490,280 Q490,315 456,315" stroke-width="2.5" fill="none"/>
    <!-- foam top -->
    <path d="M374,200 Q390,185 416,190 Q440,182 458,200" stroke-width="2"/>
    <!-- vertical lines (bubbles/ridges) -->
    <line x1="400" y1="215" x2="398" y2="330" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="416" y1="212" x2="416" y2="330" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="432" y1="215" x2="434" y2="330" stroke-width="1" stroke-dasharray="3 4"/>
  </g>

  <!-- Wine glass (right center) -->
  <g opacity="0.14" stroke="#6ee7b7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <!-- bowl -->
    <path d="M710,120 Q695,195 720,230 Q740,260 760,230 Q785,195 770,120 Z"/>
    <!-- stem -->
    <line x1="740" y1="258" x2="740" y2="330"/>
    <!-- base -->
    <line x1="715" y1="330" x2="765" y2="330"/>
    <!-- wine fill line (semi-fill hint) -->
    <path d="M710,120 Q695,195 720,230" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  </g>

  <!-- Small spirit bottle (far right top) -->
  <g opacity="0.1" stroke="#34d399" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
    <rect x="520" y="60" width="38" height="140" rx="8"/>
    <rect x="531" y="28" width="16" height="36" rx="4"/>
    <rect x="529" y="18" width="20" height="14" rx="3" fill="#34d399" opacity="0.15"/>
    <rect x="525" y="95" width="28" height="38" rx="3" stroke-dasharray="2 2"/>
  </g>

  <!-- Scattered dots / bubble accents -->
  <g opacity="0.12" fill="#34d399">
    <circle cx="140" cy="100" r="3"/>
    <circle cx="160" cy="130" r="2"/>
    <circle cx="120" cy="145" r="2.5"/>
    <circle cx="330" cy="80" r="2.5"/>
    <circle cx="350" cy="60" r="2"/>
    <circle cx="310" cy="65" r="3"/>
    <circle cx="700" cy="420" r="3"/>
    <circle cx="720" cy="440" r="2"/>
    <circle cx="740" cy="415" r="2.5"/>
    <circle cx="845" cy="310" r="3"/>
    <circle cx="865" cy="330" r="2"/>
    <circle cx="600" cy="380" r="2.5"/>
    <circle cx="580" cy="400" r="2"/>
    <circle cx="560" cy="385" r="3"/>
  </g>

  <!-- Subtle arc / swirl accents -->
  <g opacity="0.08" stroke="#2dd4bf" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M450,450 Q500,430 550,450 Q600,470 650,445"/>
    <path d="M100,60 Q150,30 200,60"/>
    <path d="M750,80 Q800,50 850,80"/>
  </g>

  <!-- Star / asterisk sparkles -->
  <g opacity="0.12" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round">
    <!-- sparkle 1 -->
    <line x1="490" y1="420" x2="490" y2="408"/>
    <line x1="484" y1="414" x2="496" y2="414"/>
    <line x1="486" y1="410" x2="494" y2="418"/>
    <line x1="494" y1="410" x2="486" y2="418"/>
    <!-- sparkle 2 -->
    <line x1="170" y1="370" x2="170" y2="358"/>
    <line x1="164" y1="364" x2="176" y2="364"/>
    <line x1="166" y1="360" x2="174" y2="368"/>
    <line x1="174" y1="360" x2="166" y2="368"/>
    <!-- sparkle 3 -->
    <line x1="760" y1="50" x2="760" y2="38"/>
    <line x1="754" y1="44" x2="766" y2="44"/>
    <line x1="756" y1="40" x2="764" y2="48"/>
    <line x1="764" y1="40" x2="756" y2="48"/>
  </g>
</svg>
